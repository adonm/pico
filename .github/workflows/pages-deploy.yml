name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build CSS
        run: yarn build:css

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create demo page
        run: |
          mkdir -p _site
          cp -r css _site/
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>12-Column Grid Test - Pico CSS</title>
              <link rel="stylesheet" href="css/pico.min.css">
              <style>
                  .demo-box {
                      background: var(--pico-primary-background);
                      color: var(--pico-primary-inverse);
                      padding: 1rem;
                      text-align: center;
                      border-radius: var(--pico-border-radius);
                  }
                  .demo-grid {
                      margin-bottom: 2rem;
                  }
              </style>
          </head>
          <body>
              <main class="container">
                  <h1>12-Column Grid Test</h1>
                  
                  <h2>Auto Grid (Default)</h2>
                  <div class="grid demo-grid">
                      <div class="demo-box">Auto</div>
                      <div class="demo-box">Auto</div>
                      <div class="demo-box">Auto</div>
                  </div>

                  <h2>12-Column: Equal Halves</h2>
                  <div class="grid demo-grid">
                      <div class="demo-box col-6">col-6</div>
                      <div class="demo-box col-6">col-6</div>
                  </div>

                  <h2>12-Column: Thirds</h2>
                  <div class="grid demo-grid">
                      <div class="demo-box col-4">col-4</div>
                      <div class="demo-box col-4">col-4</div>
                      <div class="demo-box col-4">col-4</div>
                  </div>

                  <h2>12-Column: Mixed</h2>
                  <div class="grid demo-grid">
                      <div class="demo-box col-3">col-3</div>
                      <div class="demo-box col-6">col-6</div>
                      <div class="demo-box col-3">col-3</div>
                  </div>

                  <h2>12-Column: Auto-fill (.col)</h2>
                  <div class="grid demo-grid">
                      <div class="demo-box col-4">col-4</div>
                      <div class="demo-box col">col (auto)</div>
                  </div>

                  <h2>Responsive: col-6 col-md-4</h2>
                  <div class="grid demo-grid">
                      <div class="demo-box col-6 col-md-4">Half mobile, third tablet+</div>
                      <div class="demo-box col-6 col-md-4">Half mobile, third tablet+</div>
                      <div class="demo-box col-6 col-md-4">Half mobile, third tablet+</div>
                  </div>

                  <h2>Responsive: col-12 col-md-6</h2>
                  <div class="grid demo-grid">
                      <div class="demo-box col-12 col-md-6">Full mobile, half tablet+</div>
                      <div class="demo-box col-12 col-md-6">Full mobile, half tablet+</div>
                  </div>
              </main>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
