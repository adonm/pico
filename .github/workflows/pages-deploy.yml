name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build CSS
        run: yarn build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create demo page
        run: |
          mkdir -p _site
          cp -r css _site/
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>12-Column Grid Test - Pico CSS</title>
              <link rel="stylesheet" href="css/pico.min.css">
              <style>
                  .demo-box {
                      background: var(--pico-primary-background);
                      color: var(--pico-primary-inverse);
                      padding: 1rem;
                      text-align: center;
                      border-radius: var(--pico-border-radius);
                  }
                  .demo-grid {
                      margin-bottom: 2rem;
                  }
              </style>
          </head>
          <body>
              <main class="container">
                  <h1>12-Column Grid Test</h1>
                  
                  <h2>Mode 1: Auto-fit Grid (default)</h2>
                  <p>Items divide equally without any column classes. Just add items to the grid.</p>
                  <div class="grid demo-grid">
                      <div class="demo-box">Auto-fit</div>
                      <div class="demo-box">Auto-fit</div>
                      <div class="demo-box">Auto-fit</div>
                  </div>

                  <h2>Mode 2: 12-Column Explicit Layout</h2>
                  <p>Use <code>col-*</code> classes (1-12) for precise column spans. Total must equal 12 per row.</p>

                  <h3>Equal Halves</h3>
                  <div class="grid demo-grid">
                      <div class="demo-box col-6">col-6</div>
                      <div class="demo-box col-6">col-6</div>
                  </div>

                  <h3>Thirds</h3>
                  <div class="grid demo-grid">
                      <div class="demo-box col-4">col-4</div>
                      <div class="demo-box col-4">col-4</div>
                      <div class="demo-box col-4">col-4</div>
                  </div>

                  <h3>Mixed Layout</h3>
                  <div class="grid demo-grid">
                      <div class="demo-box col-3">col-3 (25%)</div>
                      <div class="demo-box col-6">col-6 (50%)</div>
                      <div class="demo-box col-3">col-3 (25%)</div>
                  </div>

                  <h3>Sidebar Layout</h3>
                  <div class="grid demo-grid">
                      <div class="demo-box col-4">col-4 Sidebar</div>
                      <div class="demo-box col-8">col-8 Main Content</div>
                  </div>

                  <h2>Responsive: col-* with col-md-* breakpoints</h2>
                  <p>Mobile-first: base <code>col-*</code> classes apply to all screens, <code>col-md-*</code> overrides at 768px+</p>

                  <h3>Half mobile, third tablet+ (col-6 col-md-4)</h3>
                  <div class="grid demo-grid">
                      <div class="demo-box col-6 col-md-4">50% mobile, 33% tablet+</div>
                      <div class="demo-box col-6 col-md-4">50% mobile, 33% tablet+</div>
                      <div class="demo-box col-6 col-md-4">50% mobile, 33% tablet+</div>
                  </div>

                  <h3>Full mobile, half tablet+ (col-12 col-md-6)</h3>
                  <div class="grid demo-grid">
                      <div class="demo-box col-12 col-md-6">100% mobile, 50% tablet+</div>
                      <div class="demo-box col-12 col-md-6">100% mobile, 50% tablet+</div>
                  </div>

                  <h2>Summary</h2>
                  <ul>
                      <li><strong>Auto-fit:</strong> Use <code>.grid</code> without column classes for equal-width items</li>
                      <li><strong>12-Column:</strong> Use <code>col-1</code> to <code>col-12</code> for explicit layouts (sums to 12)</li>
                      <li><strong>Responsive:</strong> Use <code>col-md-*</code> to override at 768px breakpoint</li>
                  </ul>
              </main>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
